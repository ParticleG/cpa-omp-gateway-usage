[package]
name = "cpa-omp-gateway-usage"
version = "0.1.3"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/ParticleG/cpa-omp-gateway-usage"
description = "Read-only Claude subscription quota from OMP Gateway for CLIProxyAPI"

[lib]
name = "omp_gateway_usage"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
